    showcase_label: "EIF"
  - id: tcp-14
    name: "T-"
    family: "2-Flip"
    alg: "R B r R' B R' B' r' R B'"
    showcase_alg: "{L,U} (R U Rw R' U) (R' U' Rw' R U')"
    showcase_label: "EIF"
  - id: tcp-15
    name: "T"
    family: "2-Flip"
    alg: "(L R' L' R) (L' B L B')"
