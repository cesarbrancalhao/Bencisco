# TCP (1-look) — alg: CIF community notation (drives the applet); showcase_alg: what the user sees.
# Converted from tx/tcp.md with the 1ll3t bracket tables + face map; every case
# validated 1:1 against a 1ll3t T-family state (see tx/tcp-conversion.md).
# setup_prefix is prepended to each case's setup-alg (yellow on top for last layer).
# Extra variants of a case are shown as showcase_alg1, showcase_alg2, ...
setup_prefix: "LBLv"
setup_suffix: "U'"
top_down: true
cases:
  - id: tcp-01
    name: "TC+"
    family: "Even"
    alg: "B' R B R'"
    scramble: "R B' R' B"
    showcase_alg: "{B,U} U' R U R'"
    showcase_label: "EIF"
    showcase_alg1: "{R,BR} R' U R U'"
  - id: tcp-02
    name: "TC-"
    family: "Even"
    alg: "B' R B R F R' B' R F' R' B R'"
    scramble: "R B' R F R' B R F' R' B' R' B"
    showcase_alg: "{B,U} (U' R U) (R D R' U' R D') (R' U R')"
    showcase_label: "EIF"
    showcase_alg1: "{R,BR} (R' U R U') (R' U R' D' R U' R' D R2)"
