# TCP (1-look) — alg: Twizzle notation (drives the applet); showcase_alg: what the user sees.
# Converted from tx/tcp.md with the 1ll3t bracket tables + face map; every case
# validated 1:1 against a 1ll3t T-family state (see tx/tcp-conversion.md).
# setup_prefix is prepended to each case's setup-alg (yellow on top for last layer).
# Extra variants of a case are shown as showcase_alg1, showcase_alg2, ...
setup_prefix: "LBLv"
setup_suffix: "U'"
top_down: true
cases:
  - id: tcp-01
    name: "TC+"
    family: "Even"
    alg: "R' L R L'"
    showcase_alg: "{B,U} U' R U R'"
    showcase_label: "EIF"
    showcase_alg1: "{R,BR} R' U R U'"
  - id: tcp-02
    name: "TC-"
    family: "Even"
    alg: "R' L R L BL L' R' L BL' L' R L'"
    showcase_alg: "{B,U} (U' R U) (R D R' U' R D') (R' U R')"
    showcase_label: "EIF"
    showcase_alg1: "{R,BR} (R' U R U') (R' U R' D' R U' R' D R2)"
  - id: tcp-03
    name: "TC"
    family: "Even"
    alg: "R' L' BL L' R L BL' L"
    showcase_alg: "{B,U} (U' R' D R') (U R D' R)"
    showcase_label: "EIF"
  - id: tcp-04
    name: "TA-"
    family: "Even"
    alg: "R B' R' B"
    showcase_alg: "{B,BL} U R' U' R"
    showcase_label: "EIF"
    showcase_alg1: "{L,U} R U' R' U"
  - id: tcp-05
    name: "TA+"
    family: "Even"
    alg: "R B' R' B' BL' B R B' BL B R' B"
    showcase_alg: "{B,BL} (U R' U') (R' D' R U R' D) (R U' R)"
    showcase_label: "EIF"
    showcase_alg1: "{L,U} (R U' R' U) (R U' R D R' U R D' R2')"
  - id: tcp-06
    name: "TA"
    family: "Even"
    alg: "R B BL' B R' B' BL B'"
    showcase_alg: "{B,BL} (U R D' R) (U' R' D R')"
    showcase_label: "EIF"
  - id: tcp-07
    name: "TL+"
    family: "Odd"
    alg: "U' R f' U (R B' R' B) U' f R'"
    showcase_alg: "[U'] {U,BL} L BLw' U S' U' BLw L'"
  - id: tcp-08
    name: "TL-"
    family: "Odd"
    alg: "U' L' BL' L R' L' BL' L' R L BL' L"
    showcase_alg: "U' {B,U} (R' D' R U') (R' D' R' U) (R D' R)"
    showcase_label: "EIF"
    showcase_alg1: "U' {B,U} (R' D' R U') (R' D' R' U) (R2' D' R)"
  - id: tcp-09
    name: "TL"
    family: "Odd"
    alg: "U' L' BL' L R' L' BL L' R L'"
    showcase_alg: "U' {B,U} (R' D' R U') (R' D R' U) R'"
    showcase_label: "EIF"
  - id: tcp-10
    name: "TR-"
    family: "Odd"
    alg: "U B br' U' (L' B L B') U br B'"
    showcase_alg: "[U] L BLw' U' S U BLw L'"
  - id: tcp-11
    name: "TR+"
    family: "Odd"
    alg: "U B BL B' R B BL B R' B' BL B'"
    showcase_alg: "U {B,BL} (R D R' U) (R D R U') (R' D R')"
    showcase_label: "EIF"
  - id: tcp-12
