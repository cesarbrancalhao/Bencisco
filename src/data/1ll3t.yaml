# 1LL3T — All 180 cases extracted from zwegner.github.io/cubing/fto/1l3t.html
# Notation: CIF (corner-in-front), yellow top, blue front.
# Showcase algs: S = sledge, H = hedge; {X,Y} = reorient (X on top, Y in front); [U] = pre-AUF.
# alg: Twizzle notation (rotations/S/H/slices resolved to plain CIF face turns + lowercase
#   wides) — drives the applet and thumbnails. Community->Twizzle face map: F->BL, B->R,
#   L->B, R->L, BL->BR, BR->F (U/D fixed); prefix "Rv T" puts yellow on top.
# showcase_alg: the written alg shown to the user (community notation, bold).
# showcase_label: "(EIF)" or "(CIF -> EIF)" styled prefix when the showcase alg isn't pure CIF.
# eif_alg: optional EIF variant, shown secondary with an "(EIF)" label.
# setup_prefix is prepended to each case's setup-alg (yellow on top for last layer).
